services:
  api:
    image: mongstudio/mongle-ai:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8010:8010"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
