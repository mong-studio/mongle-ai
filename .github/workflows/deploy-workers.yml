name: Deploy RunPod Workers

# worker 파일이 바뀌거나 v* 태그를 달 때만 빌드
# — 일반 파이썬 코드 변경에는 Docker 빌드가 트리거되지 않음
on:
  push:
    branches: [main]
    paths:
      - 'runpod_workers/**'
      - '.github/workflows/deploy-workers.yml'
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: '빌드할 워커 (llm | image | all)'
        required: false
        default: all

env:
  LLM_IMAGE:         ${{ secrets.DOCKERHUB_USERNAME }}/mongle-llm-worker
  PLANNER_LLM_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mongle-planner-llm-worker
  IMAGE_IMAGE:       ${{ secrets.DOCKERHUB_USERNAME }}/mongle-image-worker

concurrency:
  group: deploy-runpod-workers-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  detect-changes:
    name: Detect changed workers
    runs-on: ubuntu-latest
    outputs:
      llm: ${{ steps.force.outputs.all == 'true' || steps.force.outputs.llm == 'true' || steps.changes.outputs.llm == 'true' || steps.changes.outputs.workflow == 'true' || steps.changes.outputs.common == 'true' }}
      image: ${{ steps.force.outputs.all == 'true' || steps.force.outputs.image == 'true' || steps.changes.outputs.image == 'true' || steps.changes.outputs.workflow == 'true' || steps.changes.outputs.common == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve forced target
        id: force
        shell: bash
        run: |
          all=false
          llm=false
          image=false

          if [[ "${{ startsWith(github.ref, 'refs/tags/v') }}" == "true" ]]; then
            all=true
          fi

          case "${{ github.event.inputs.target || '' }}" in
            all) all=true ;;
            llm) llm=true ;;
            image) image=true ;;
          esac

          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "llm=$llm" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Detect path changes
        id: changes
        if: steps.force.outputs.all != 'true' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            llm:
              - 'runpod_workers/llm/**'
            image:
              - 'runpod_workers/image_gen/**'
            common:
              - 'runpod_workers/Makefile'
              - 'runpod_workers/setup_*.py'
            workflow:
              - '.github/workflows/deploy-workers.yml'

  # ── LLM 워커 (플래너 · 빌리지 공용 이미지) ──────────────────────────────────
  build-llm:
    name: LLM Worker — build & push
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.llm == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.LLM_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      # Docker Hub 레지스트리 캐시 사용
      # — Qwen 7B 가중치 레이어(14 GB)는 bake.py 가 바뀌지 않으면 캐시 히트
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runpod_workers/llm
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=registry,ref=${{ env.LLM_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.LLM_IMAGE }}:buildcache,mode=max

  # ── planner LLM 워커 (EXAONE 베이스) ────────────────────────────────────────
  # character 와 같은 Dockerfile 이지만 build-arg 로 EXAONE 을 구워 둔다.
  build-llm-planner:
    name: Planner LLM Worker (EXAONE) — build & push
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.llm == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PLANNER_LLM_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runpod_workers/llm
          platforms: linux/amd64
          push: true
          # EXAONE 베이스를 빌드 때 구워 둔다(revision 비움 = latest).
          build-args: |
            LLM_BASE_MODEL=LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct
            LLM_BASE_MODEL_REVISION=
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=registry,ref=${{ env.PLANNER_LLM_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.PLANNER_LLM_IMAGE }}:buildcache,mode=max

  # ── 이미지 생성 워커 ──────────────────────────────────────────────────────────
  build-image-gen:
    name: Image Gen Worker — build & push
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.image == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runpod_workers/image_gen
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=registry,ref=${{ env.IMAGE_IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE_IMAGE }}:buildcache,mode=max

  # ── RunPod 템플릿 자동 업데이트 (v* 태그 시에만) ────────────────────────────
  update-runpod:
    name: Update RunPod Templates
    runs-on: ubuntu-latest
    needs: [build-llm, build-llm-planner, build-image-gen]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Update LLM templates (planner + character)
        env:
          RUNPOD_API_KEY:               ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_PLANNER_TEMPLATE_ID:   ${{ secrets.RUNPOD_PLANNER_TEMPLATE_ID }}
          RUNPOD_CHARACTER_TEMPLATE_ID: ${{ secrets.RUNPOD_CHARACTER_TEMPLATE_ID }}
          # planner 는 EXAONE 이미지, character 는 Qwen 이미지로 분리한다.
          PLANNER_IMAGE:   ${{ env.PLANNER_LLM_IMAGE }}:${{ github.ref_name }}
          CHARACTER_IMAGE: ${{ env.LLM_IMAGE }}:${{ github.ref_name }}
        run: |
          # 현재 템플릿 전체 조회
          FETCH=$(jq -nc '{"query":"{ myself { podTemplates { id name imageName containerDiskInGb dockerArgs env { key value } volumeInGb isServerless } } }"}')

          # 템플릿 전체 1회 조회
          TEMPLATES=$(curl -sf \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -d "$FETCH" \
            https://api.runpod.io/graphql) || { echo "fetch failed"; exit 1; }

          for ENV_KEY in RUNPOD_PLANNER_TEMPLATE_ID RUNPOD_CHARACTER_TEMPLATE_ID; do
            TID="${!ENV_KEY}"
            if [ "$ENV_KEY" = "RUNPOD_PLANNER_TEMPLATE_ID" ]; then
              NEW_IMAGE="$PLANNER_IMAGE"
            else
              NEW_IMAGE="$CHARACTER_IMAGE"
            fi
            echo "Updating $ENV_KEY ($TID) -> $NEW_IMAGE"

            TMPL=$(echo "$TEMPLATES" | jq -c --arg tid "$TID" \
              '.data.myself.podTemplates[] | select(.id == $tid)')

            if [ -z "$TMPL" ]; then
              echo "ERROR: template $TID not found. Available templates:"
              echo "$TEMPLATES" | jq -r '.data.myself.podTemplates[] | "\(.id)  \(.name)"'
              exit 1
            fi

            PAYLOAD=$(echo "$TMPL" | jq -c --arg img "$NEW_IMAGE" '{
              query: "mutation U($i:SaveTemplateInput!){saveTemplate(input:$i){id imageName}}",
              variables: { i: {
                id: .id, name: .name, imageName: $img,
                containerDiskInGb: .containerDiskInGb,
                dockerArgs: (.dockerArgs // ""),
                env: (.env // []),
                volumeInGb: (.volumeInGb // 0),
                isServerless: (.isServerless // true)
              }}
            }')

            RESP=$(curl -sf \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $RUNPOD_API_KEY" \
              -d "$PAYLOAD" \
              https://api.runpod.io/graphql) || { echo "update failed"; exit 1; }
            echo "$RESP" | jq -e '.errors == null' > /dev/null \
              || { echo "GraphQL error: $RESP"; exit 1; }
            echo "  updated: $(echo "$RESP" | jq -r '.data.saveTemplate')"
          done

      - name: Update Image Gen template
        env:
          RUNPOD_API_KEY:           ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_IMAGE_TEMPLATE_ID: ${{ secrets.RUNPOD_IMAGE_TEMPLATE_ID }}
          NEW_IMAGE: ${{ env.IMAGE_IMAGE }}:${{ github.ref_name }}
        run: |
          echo "Updating RUNPOD_IMAGE_TEMPLATE_ID ($RUNPOD_IMAGE_TEMPLATE_ID) -> $NEW_IMAGE"
          FETCH=$(jq -nc '{"query":"{ myself { podTemplates { id name imageName containerDiskInGb dockerArgs env { key value } volumeInGb isServerless } } }"}')
          TEMPLATES=$(curl -sf \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -d "$FETCH" \
            https://api.runpod.io/graphql) || { echo "fetch failed"; exit 1; }

          TMPL=$(echo "$TEMPLATES" | jq -c --arg tid "$RUNPOD_IMAGE_TEMPLATE_ID" \
            '.data.myself.podTemplates[] | select(.id == $tid)')

          PAYLOAD=$(echo "$TMPL" | jq -c --arg img "$NEW_IMAGE" '{
            query: "mutation U($i:SaveTemplateInput!){saveTemplate(input:$i){id imageName}}",
            variables: { i: {
              id: .id, name: .name, imageName: $img,
              containerDiskInGb: .containerDiskInGb,
              dockerArgs: (.dockerArgs // ""),
              env: (.env // []),
              volumeInGb: (.volumeInGb // 0),
              isServerless: (.isServerless // true)
            }}
          }')

          RESP=$(curl -sf \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $RUNPOD_API_KEY" \
            -d "$PAYLOAD" \
            https://api.runpod.io/graphql) || { echo "update failed"; exit 1; }
          echo "$RESP" | jq -e '.errors == null' > /dev/null \
            || { echo "GraphQL error: $RESP"; exit 1; }
          echo "Updated: $(echo "$RESP" | jq -r '.data.saveTemplate')"

  # ── GitHub Release (v* 태그 시에만) ─────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-llm, build-llm-planner, build-image-gen]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const llm     = `${{ env.LLM_IMAGE }}:${tag}`
            const planner = `${{ env.PLANNER_LLM_IMAGE }}:${tag}`
            const image   = `${{ env.IMAGE_IMAGE }}:${tag}`

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name:               tag,
              name:                   `Release ${tag}`,
              generate_release_notes: true,
              body: [
                '## Docker Images',
                '',
                `- LLM Worker (character/빌리지, Qwen): \`${llm}\``,
                `- Planner LLM Worker (EXAONE):         \`${planner}\``,
                `- Image Gen Worker:                    \`${image}\``,
                '',
                '> RunPod 템플릿은 CI/CD 에서 자동 업데이트됩니다.',
              ].join('\n'),
            })
