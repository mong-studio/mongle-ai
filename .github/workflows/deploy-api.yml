name: Deploy API Server

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'agents/**'
      - 'adapters/**'
      - 'Dockerfile'
      - 'requirements-api.txt'
  workflow_dispatch:

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mongle-ai

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --group dev
      - name: Run tests
        run: uv run pytest

  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

  deploy:
    name: Deploy to RunPod Pod
    runs-on: ubuntu-latest
    needs: build

    steps:
      # 장수 CPU Pod 를 stop→start 해 :latest 를 재-pull 한다.
      # (RunPod 은 재시작 시 컨테이너 디스크를 비우므로 :latest 가 새로 받아진다.)
      # Pod ID 는 유지되어 프록시 URL 이 고정된다 → mongle-server 갱신 불필요.
      # Pod 의 앱 env 는 최초 생성(runpod_workers/setup_pod.py)에서 주입되어 상주한다.
      - name: Restart RunPod Pod (re-pull :latest)
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          POD_ID:         ${{ secrets.RUNPOD_POD_ID }}
        run: |
          set -euo pipefail

          rp() {  # $1=METHOD  $2=PATH
            curl -sf -X "$1" \
              -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
              -H "Content-Type: application/json" \
              "https://rest.runpod.io/v1${2}"
          }

          echo "Stopping pod ${POD_ID} ..."
          rp POST "/pods/${POD_ID}/stop" || true
          sleep 10

          echo "Starting pod ${POD_ID} (container disk wiped → :latest re-pull) ..."
          rp POST "/pods/${POD_ID}/start"

          URL="https://${POD_ID}-8010.proxy.runpod.net/health"
          echo "Health check (cold start: image pull + boot) → ${URL}"
          for i in $(seq 1 40); do
            if curl -sf "${URL}" >/dev/null 2>&1; then
              echo "Healthy ✔ (${i})"
              exit 0
            fi
            echo "  waiting ${i}/40 ..."
            sleep 15
          done

          echo "[ERROR] Health check failed after ~10m: ${URL}"
          exit 1
